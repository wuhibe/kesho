# The DB-backed Letter tests (lib/*.db-test.ts) against a throwaway Postgres (issue #28).
# The rest of the checks run in the pre-commit hook.
name: DB tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  db-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18 # Neon runs Postgres 18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kesho_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:db
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kesho_test
